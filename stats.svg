<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="GitHub stats">
<defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#050a14"/>
        <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00d9ff"/>
        <stop offset="100%" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00d9ff"/>
        <stop offset="100%" stop-color="#ffb020"/>
    </linearGradient>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="outer"><rect x="0" y="0" width="480" height="260" rx="18"/></clipPath>
</defs>
<g clip-path="url(#outer)">
    <rect width="480" height="260" fill="url(#bgGrad)"/>
    <circle cx="60" cy="30" r="90" fill="#ffb020" opacity="0.12" filter="url(#blurSoft)"/>
    <text x="24" y="26" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#eaf3ff">📊 GitHub Stats</text>

    <g transform="translate(92,130)">
        <circle r="62" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="12"/>
        <circle r="62" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="389.6" stroke-dashoffset="389.6" transform="rotate(-90)">
            <animate attributeName="stroke-dashoffset" from="389.6" to="345.9" begin="0.4s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
        </circle>
        <text x="0" y="-4" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="34" font-weight="800" fill="#eaf3ff" opacity="0">B
            <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
        </text>
        <text x="0" y="18" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#7d94b8" opacity="0">RANK
            <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>
        </text>
    </g>

    <g transform="translate(210,30)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.90s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="40,0" to="0,0" begin="0.90s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="13" fill="#7d94b8">Total Stars</text>
    <text x="190" y="0" text-anchor="end" font-family="'Consolas',monospace" font-size="14" font-weight="700" fill="#eaf3ff">4</text>
    <rect x="0" y="8" width="190" height="7" rx="3.5" fill="rgba(255,255,255,0.05)" stroke="rgba(0,217,255,0.18)" stroke-width="0.75"/>
    <rect x="0" y="8" width="0" height="7" rx="3.5" fill="url(#barGrad)">
        <animate attributeName="width" from="0" to="1.5" begin="1.05s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
</g><g transform="translate(210,82)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.08s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="40,0" to="0,0" begin="1.08s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="13" fill="#7d94b8">Total Commits</text>
    <text x="190" y="0" text-anchor="end" font-family="'Consolas',monospace" font-size="14" font-weight="700" fill="#eaf3ff">402</text>
    <rect x="0" y="8" width="190" height="7" rx="3.5" fill="rgba(255,255,255,0.05)" stroke="rgba(0,217,255,0.18)" stroke-width="0.75"/>
    <rect x="0" y="8" width="0" height="7" rx="3.5" fill="url(#barGrad)">
        <animate attributeName="width" from="0" to="25.5" begin="1.23s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
</g><g transform="translate(210,134)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.26s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="40,0" to="0,0" begin="1.26s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="13" fill="#7d94b8">Repositories</text>
    <text x="190" y="0" text-anchor="end" font-family="'Consolas',monospace" font-size="14" font-weight="700" fill="#eaf3ff">18</text>
    <rect x="0" y="8" width="190" height="7" rx="3.5" fill="rgba(255,255,255,0.05)" stroke="rgba(0,217,255,0.18)" stroke-width="0.75"/>
    <rect x="0" y="8" width="0" height="7" rx="3.5" fill="url(#barGrad)">
        <animate attributeName="width" from="0" to="57.0" begin="1.41s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
</g><g transform="translate(210,186)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.44s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="40,0" to="0,0" begin="1.44s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="13" fill="#7d94b8">Followers</text>
    <text x="190" y="0" text-anchor="end" font-family="'Consolas',monospace" font-size="14" font-weight="700" fill="#eaf3ff">2</text>
    <rect x="0" y="8" width="190" height="7" rx="3.5" fill="rgba(255,255,255,0.05)" stroke="rgba(0,217,255,0.18)" stroke-width="0.75"/>
    <rect x="0" y="8" width="0" height="7" rx="3.5" fill="url(#barGrad)">
        <animate attributeName="width" from="0" to="1.3" begin="1.59s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
</g>
    <rect x="0.5" y="0.5" width="479" height="259" rx="17" fill="none" stroke="rgba(0,217,255,0.18)" stroke-width="1"/>
</g>
</svg>